---
- name: 'Configure tmux'
  ansible.builtin.copy:
    src: 'tmux.conf'
    dest: '/root/.tmux.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Configure vim'
  ansible.builtin.copy:
    src: 'vimrc'
    dest: '/root/.vimrc'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Create containers config directory'
  ansible.builtin.file:
    path: '/root/.config/containers'
    owner: 'root'
    group: 'root'
    mode: '0750'
    state: 'directory'

- name: 'Create containers authentication file'
  ansible.builtin.copy:
    dest: '/root/.config/containers/auth.json'
    content: "{{ lab_pull_secret }}\n"
    owner: 'root'
    group: 'root'
    mode: '0644'
  no_log: "{{ lab_host_hide_secrets | bool }}"

- name: 'Configure chronyd'
  ansible.builtin.template:
    src: 'chrony.conf.j2'
    dest: '/etc/chrony.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify:
    - 'svc restart chronyd'

- name: 'Configure squid'
  ansible.builtin.template:
    src: 'squid.conf.j2'
    dest: '/etc/squid/squid.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify:
    - 'svc restart squid'

- name: 'Enable squid service'
  ansible.builtin.service:
    name: 'squid'
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: 'Configure aws credentials'
  community.general.ini_file:
    path: '/root/.aws/credentials'
    section: 'default'
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  loop:
    - { option: 'aws_access_key_id', value: "{{ lab_aws_access_key_id }}" }
    - { option: 'aws_secret_access_key', value: "{{ lab_aws_secret_access_key }}" }
    - { option: 'region', value: "{{ lab_aws_region | default('us-east-1') }}" }
    - { option: 'output', value: "{{ lab_aws_output | default('json') }}" }
  no_log: "{{ lab_host_hide_secrets | bool }}"
  when:
    - lab_host_aws
    - lab_aws_access_key_id is defined
    - lab_aws_secret_access_key is defined

- name: 'Configure SSH host entries'
  community.general.ssh_config:
    user: "{{ item.user | default('root') }}"
    host: "{{ item.host }}"
    hostname: "{{ item.hostname | default(omit) }}"
    remote_user: "{{ item.remote_user | default(omit) }}"
    identity_file: "{{ item.identity_file | default(omit) }}"
    user_known_hosts_file: "{{ item.user_known_hosts_file | default(omit) }}"
    strict_host_key_checking: "{{ item.strict_host_key_checking | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ lab_host_ssh_config_hosts }}"