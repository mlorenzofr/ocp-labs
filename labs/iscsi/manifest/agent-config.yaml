---
apiVersion: v1alpha1
kind: AgentConfig
metadata:
  name: iscsi
rendezvousIP: 192.168.125.90
hosts:
  - hostname: iscsi-node-1
    interfaces:
      - name: enp1s0
        macAddress: 52:54:00:00:00:90
    networkConfig:
      interfaces:
        - name: enp1s0
          type: ethernet
          state: up
          mac-address: 52:54:00:00:00:90
          ipv4:
            enabled: True
            dhcp: True
          ipv6:
            enabled: False
    rootDeviceHints:
      deviceName: "/dev/vda"
