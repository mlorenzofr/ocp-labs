---
# Run it with:
#   ap labs/ztvp/deploy.yaml

- name: 'Clean ztvp lab'
  ansible.builtin.import_playbook: ../../playbooks/jobs/clean-lab.yml
  vars:
    lab_name: 'ztvp'
  tags:
    - 'clean'
    - 'clean-ztvp-hub'
    - 'never'

- name: 'Clean 2nd ztvp lab'
  ansible.builtin.import_playbook: ../../playbooks/jobs/clean-lab.yml
  vars:
    lab_name: 'ztvp2'
  tags:
    - 'clean'
    - 'clean-ztvp2-hub'
    - 'never'

- name: 'Clean spoke cluster #1'
  ansible.builtin.import_playbook: ../../playbooks/jobs/clean-lab.yml
  vars:
    lab_name: 'ztvp-spoke-1'
  tags:
    - 'clean'
    - 'clean-spoke'
    - 'clean-ztvp-spoke-1'
    - 'never'

- name: 'Clean spoke cluster #2'
  ansible.builtin.import_playbook: ../../playbooks/jobs/clean-lab.yml
  vars:
    lab_name: 'ztvp-spoke-2'
  tags:
    - 'clean'
    - 'clean-spoke'
    - 'clean-ztvp-spoke-2'
    - 'never'

# use a different base when switching lab_node_network_base (LAB_DISCONNECTED=true).
- name: 'Configure network for ZTVP hubs'
  hosts:
    - 'lab'
  gather_facts: false
  tags:
    - 'ocp'
    - 'ztvp-hub'
    - 'ztvp-hub-install'
    - 'ztvp2-hub'
    - 'ztvp2-hub-install'
  vars:
    __lab_mac_base: 'ce:00:0a:ba:ee:'
    __lab_mac_base_disconnected: 'ce:00:0a:ba:ef:'
  tasks:
    - name: 'Set default MAC base for ZTVP hubs'
      ansible.builtin.set_fact:
        lab_mac_base: "{{ __lab_mac_base }}"

    - name: 'Apply disconnected network overrides'
      when: lookup('ansible.builtin.env', 'LAB_DISCONNECTED') | lower == 'true'
      block:
        - name: 'Set disconnected network and MAC base'
          ansible.builtin.set_fact:
            lab_node_network_base: '192.168.129.'
            lab_network_name: 'pinnedis-net'
            lab_mac_base: "{{ __lab_mac_base_disconnected }}"

- name: 'Install ZTVP hub cluster'
  ansible.builtin.import_playbook: ../../playbooks/base/abi.yaml
  tags:
    - 'ocp'
    - 'ztvp-hub'
    - 'ztvp-hub-install'
  vars:
    lab_name: 'ztvp'
    lab_node_cpus: 16
    lab_node_memory: 42000
    lab_node_disk_data: 320
    lab_custom_capability_set: 'None'
    lab_custom_capabilities:
      - baremetal
      - MachineAPI
      - marketplace
      - OperatorLifecycleManager
      - Console
      - Ingress
      - Storage
      - NodeTuning
      - DeploymentConfig
      - ImageRegistry
    start_install: true

- name: 'Install ZTVP hub cluster (2nd environment)'
  ansible.builtin.import_playbook: ../../playbooks/base/abi.yaml
  tags:
    - 'ocp'
    - 'ztvp2-hub'
    - 'ztvp2-hub-install'
  vars:
    lab_name: 'ztvp2'
    lab_node_cpus: 16
    lab_node_memory: 42000
    lab_node_disk_data: 320
    lab_custom_capability_set: 'None'
    lab_custom_capabilities:
      - baremetal
      - MachineAPI
      - marketplace
      - OperatorLifecycleManager
      - Console
      - Ingress
      - Storage
      - NodeTuning
      - DeploymentConfig
      - ImageRegistry
    start_install: true

- name: 'ZTVP hub cluster post-installation tasks'
  hosts:
    - 'lab'
  gather_facts: false
  tags:
    - 'postinst'
    - 'ztvp-hub'
    - 'ztvp-hub-post'
  vars:
    lab_name: 'ztvp'
    lab_configs: "/root/labs/{{ lab_name }}/config"
    ocp_lvms_ns: 'lvms-operator'

  environment:
    KUBECONFIG: "/root/labs/{{ lab_name }}/deploy/auth/kubeconfig"
  roles:
    - 'ocp_lvms'

- name: 'ZTVP hub cluster post-installation tasks (2nd environment)'
  hosts:
    - 'lab'
  gather_facts: false
  tags:
    - 'postinst'
    - 'ztvp2-hub'
    - 'ztvp2-hub-post'
  vars:
    lab_name: 'ztvp2'
    lab_configs: "/root/labs/{{ lab_name }}/config"
    ocp_lvms_ns: 'lvms-operator'

  environment:
    KUBECONFIG: "/root/labs/{{ lab_name }}/deploy/auth/kubeconfig"
  roles:
    - 'ocp_lvms'

- name: 'Install spoke cluster #1'
  ansible.builtin.import_playbook: ../../playbooks/base/sno.yaml
  vars:
    lab_name: 'ztvp-spoke-1'
    lab_node_cpus: 16
    start_install: true
    lab_node_disk_data: 10
    lab_hosts:
      - {'iface': 'enp1s0'}
    lab_custom_capability_set: 'None'
    lab_custom_capabilities:
      - baremetal
      - MachineAPI
      - marketplace
      - OperatorLifecycleManager
      - Console
      - Ingress
      - Storage
      - NodeTuning
      - DeploymentConfig
  tags:
    - 'ocp'
    - 'ztvp-spoke-1'
    - 'spoke'
    - 'never'

- name: 'ZTVP spoke cluster #1 post-installation tasks'
  hosts:
    - 'lab'
  gather_facts: false
  tags:
    - 'postinst'
    - 'spoke'
    - 'ztvp-spoke-1'
  vars:
    lab_name: 'ztvp-spoke-1'
    lab_configs: "/root/labs/{{ lab_name }}/config"
  environment:
    KUBECONFIG: "/root/labs/{{ lab_name }}/deploy/auth/kubeconfig"
  roles:
    - 'ocp_lvms'

- name: 'Install spoke cluster #2'
  ansible.builtin.import_playbook: ../../playbooks/base/sno.yaml
  vars:
    lab_name: 'ztvp-spoke-2'
    lab_node_cpus: 16
    start_install: true
    lab_node_disk_data: 10
    lab_hosts:
      - {'iface': 'enp1s0'}
    lab_custom_capability_set: 'None'
    lab_custom_capabilities:
      - baremetal
      - MachineAPI
      - marketplace
      - OperatorLifecycleManager
      - Console
      - Ingress
      - Storage
      - NodeTuning
      - DeploymentConfig
  tags:
    - 'ocp'
    - 'ztvp-spoke-2'
    - 'spoke'
    - 'never'

- name: 'ZTVP spoke cluster #2 post-installation tasks'
  hosts:
    - 'lab'
  gather_facts: false
  tags:
    - 'postinst'
    - 'spoke'
    - 'ztvp-spoke-2'
  vars:
    lab_name: 'ztvp-spoke-2'
    lab_configs: "/root/labs/{{ lab_name }}/config"
  environment:
    KUBECONFIG: "/root/labs/{{ lab_name }}/deploy/auth/kubeconfig"
  roles:
    - 'ocp_lvms'
